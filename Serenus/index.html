<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serenus - Calm Mind</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Video -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="assets/sakura.mp4" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
  <div id="overlay"></div>

  <!-- Background Music -->
  <audio id="bgm" loop>
    <source src="assets/calm-bgm.mp3" type="audio/mpeg">
  </audio>

  <!-- Main Content -->
  <div class="content">
    <h1>Serenus</h1>
    <p>Your calm space for mental wellness.</p>
    <button onclick="playBGM()">Play Calm Music</button>

    <!-- Mood Check-In -->
    <section>
      <h2>Mood Check-In</h2>
      <label for="mood">How are you feeling?</label>
      <select id="mood">
        <option value="happy">😊 Happy</option>
        <option value="sad">😔 Sad</option>
        <option value="anxious">😰 Anxious</option>
        <option value="tired">😴 Tired</option>
      </select>
      <button onclick="showMoodMessage()">Check Mood</button>
      <p id="mood-result" style="color:#5CA4A9;"></p>
    </section>

    <!-- Micro Journaling -->
    <section>
      <h2>Micro Journaling</h2>
      <label for="journal">Write 1-3 sentences about your day:</label>
      <textarea id="journal" rows="4" placeholder="I feel…"></textarea>
      <button onclick="summarizeJournal()">Summarize</button>
      <p id="journal-result" style="color:#5CA4A9;"></p>
    </section>

    <!-- Guided Breathing -->
    <section>
      <h2>Guided Breathing</h2>
      <p>Follow the circle to breathe calmly.</p>
      <div id="breathing-circle"></div>
    </section>

    <footer>
      🌸 Made with calm intentions by your hackathon team
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
